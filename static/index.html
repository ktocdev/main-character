<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal</title>
<style>
  :root {
    --bg: #211d19;          /* warm charcoal, not pitch black */
    --bg-raised: #2a2521;
    --bg-input: #322c27;
    --text: #e8e0d5;
    --text-dim: #a99f92;
    --accent: #d99e5b;      /* lamp amber */
    --accent-dim: #8a6a44;
    --border: #3d362f;
    --you: #c9b99f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf7f2; --bg-raised: #ffffff; --bg-input: #f1ece4;
      --text: #38322b; --text-dim: #8c8378; --accent: #b5732f;
      --accent-dim: #d9b183; --border: #e4dcd0; --you: #6b5d49;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.65 Georgia, 'Times New Roman', serif;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 1.5rem;
    padding: 1rem 1.5rem .8rem; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.15rem; font-weight: normal; font-style: italic; color: var(--accent); }
  header .status { font-size: .8rem; color: var(--text-dim); font-family: system-ui, sans-serif; }
  nav { margin-left: auto; display: flex; gap: .25rem; }
  nav button {
    background: none; border: none; color: var(--text-dim);
    font: .9rem system-ui, sans-serif; padding: .35rem .8rem;
    border-radius: 6px; cursor: pointer;
  }
  nav button.active { background: var(--bg-input); color: var(--text); }
  main { flex: 1; overflow: hidden; display: flex; }
  .tab { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .tab.active { display: flex; }

  /* Chat */
  #log { flex: 1; overflow-y: auto; padding: 1.5rem; max-width: 46rem; margin: 0 auto; width: 100%; }
  .msg { margin-bottom: 1.4rem; white-space: pre-wrap; }
  .msg.you { color: var(--you); }
  .msg.you::before { content: "you"; }
  .msg.companion::before { content: "companion"; }
  .msg::before {
    display: block; font: .7rem system-ui, sans-serif; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent-dim); margin-bottom: .25rem;
  }
  .composer {
    display: flex; gap: .6rem; padding: 1rem 1.5rem 1.25rem;
    max-width: 46rem; margin: 0 auto; width: 100%;
  }
  textarea, input[type=text] {
    background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: .7rem .9rem; font: inherit; width: 100%;
    resize: none; outline: none;
  }
  textarea:focus, input[type=text]:focus { border-color: var(--accent-dim); }
  button.send {
    background: var(--accent); color: var(--bg); border: none; border-radius: 10px;
    padding: 0 1.2rem; font: .95rem system-ui, sans-serif; cursor: pointer; flex-shrink: 0;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  button.quiet {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: .3rem .7rem; font: .8rem system-ui, sans-serif; cursor: pointer;
  }

  /* Write */
  #write { padding: 1.5rem; max-width: 46rem; margin: 0 auto; width: 100%; overflow-y: auto; }
  #write h2, #entities-pane h2 { font-weight: normal; font-style: italic; font-size: 1.05rem; color: var(--text-dim); margin-bottom: 1rem; }
  #entry-text { min-height: 14rem; margin-bottom: .8rem; }
  #entry-response { margin-top: 1.5rem; white-space: pre-wrap; }
  .saved-note { font: .8rem system-ui, sans-serif; color: var(--accent-dim); margin-left: 1rem; }

  /* Entities */
  #entities-pane { flex: 1; display: flex; overflow: hidden; }
  #entity-list { width: 21rem; border-right: 1px solid var(--border); overflow-y: auto; padding: 1.2rem; }
  #entity-list .kind { font: .7rem system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-dim); margin: 1rem 0 .4rem; }
  #entity-list .ent {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text); font: .95rem system-ui, sans-serif; padding: .25rem .4rem;
    border-radius: 6px; cursor: pointer;
  }
  #entity-list .ent:hover, #entity-list .ent.sel { background: var(--bg-input); }
  #entity-list .ent .n { color: var(--text-dim); font-size: .8rem; }
  #entity-detail { flex: 1; overflow-y: auto; padding: 1.5rem; }
  #entity-doc { font-size: .95rem; margin-top: 1rem; }
  #entity-meta { font: .8rem system-ui, sans-serif; color: var(--text-dim); }
  .ent-actions { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-top: .8rem; }
  .ent-actions input { width: 12rem; padding: .35rem .6rem; font-size: .85rem; }
  .ent-actions select {
    background: var(--bg-input); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 8px; padding: .3rem .5rem; font: .8rem system-ui, sans-serif;
  }
  .alias-label { font: .8rem system-ui, sans-serif; color: var(--text-dim); }
  .chip {
    display: inline-flex; align-items: center; gap: .3rem; background: var(--bg-input);
    border-radius: 999px; padding: .1rem .6rem; font: .8rem system-ui, sans-serif;
    margin-right: .3rem;
  }
  .chip button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .9rem; padding: 0; }
  .obs-date { font: .7rem system-ui, sans-serif; color: var(--accent-dim); text-transform: uppercase; letter-spacing: .06em; margin: 1.1rem 0 .3rem; }
  .obs { display: flex; gap: .5rem; align-items: baseline; padding: .15rem 0; }
  .obs .t { flex: 1; }
  .obs .ops { visibility: hidden; display: flex; gap: .2rem; }
  .obs:hover .ops { visibility: visible; }
  .obs .ops button {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font: .75rem system-ui, sans-serif; padding: .1rem .3rem;
  }
  .obs .ops button:hover { color: var(--accent); }
  #suggest-panel { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1.2rem; }
  .sg { border-bottom: 1px solid var(--border); padding: .6rem 0; }
  .sg:last-child { border-bottom: none; }
  .sg .r { font: .8rem system-ui, sans-serif; color: var(--text-dim); margin: .2rem 0 .4rem; }
  #search { margin-bottom: .5rem; font-size: .9rem; padding: .4rem .7rem; }
  #suggest-btns { display: flex; gap: .4rem; margin-bottom: .6rem; }
  .thinking { color: var(--text-dim); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>journal</h1>
  <span class="status" id="status"></span>
  <nav>
    <button data-tab="chat" class="active">chat</button>
    <button data-tab="write">write</button>
    <button data-tab="entities">entities</button>
    <button class="quiet" id="undo-btn" title="undo last entity change">↺</button>
    <button class="quiet" id="redo-btn" title="redo">↻</button>
    <button class="quiet" id="refresh-summaries" title="regenerate the weekly arc + status snapshot after new entries">refresh memory</button>
    <button class="quiet" id="reset" title="start a fresh conversation">new chat</button>
  </nav>
</header>
<main>
  <section class="tab active" id="tab-chat">
    <div id="log"></div>
    <div class="composer">
      <textarea id="chat-text" rows="2" placeholder="ask about your journal…"></textarea>
      <button class="send" id="chat-send">send</button>
    </div>
  </section>

  <section class="tab" id="tab-write">
    <div id="write">
      <h2>new entry</h2>
      <textarea id="entry-text" placeholder="write freely…"></textarea>
      <div>
        <button class="send" id="entry-send">save entry</button>
        <span class="saved-note" id="entry-saved"></span>
      </div>
      <div id="entry-response" class="msg companion" style="display:none"></div>
    </div>
  </section>

  <section class="tab" id="tab-entities">
    <div id="entities-pane">
      <div id="entity-list">
        <input type="text" id="search" placeholder="filter…">
        <div id="suggest-btns">
          <button class="quiet" data-suggest="person">suggest people merges</button>
          <button class="quiet" data-suggest="project">projects</button>
          <button class="quiet" data-suggest="place">places</button>
        </div>
        <div id="entity-groups"></div>
      </div>
      <div id="entity-detail">
        <div id="suggest-panel" style="display:none"></div>
        <h2 id="entity-name">select an entity</h2>
        <div id="entity-meta"></div>
        <div class="ent-actions" id="entity-actions" style="display:none">
          <input type="text" id="merge-target" placeholder="target name…">
          <button class="quiet" id="merge-btn" title="combine; this name is kept as an alias">merge into</button>
          <button class="quiet" id="correct-btn" title="typo fix; this name is NOT kept as an alias">correct to</button>
          <button class="quiet" id="rename-btn" title="change spelling/case of this entity's name">rename</button>
          <select id="retype-kind">
            <option value="">retype…</option>
            <option value="person">person</option>
            <option value="project">project</option>
            <option value="place">place</option>
          </select>
          <button class="quiet" id="delete-btn">delete</button>
        </div>
        <div class="ent-actions" id="alias-row" style="display:none">
          <span class="alias-label">aliases:</span>
          <span id="alias-chips"></span>
          <input type="text" id="alias-new" placeholder="add alias…" style="width:9rem">
          <button class="quiet" id="alias-add-btn">add</button>
        </div>
        <div id="entity-doc"></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let entities = {}, selected = null;

// ---- tabs ----
document.querySelectorAll('nav button[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button[data-tab]').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  $('tab-' + b.dataset.tab).classList.add('active');
  if (b.dataset.tab === 'entities') loadEntities();
});

// ---- status ----
async function refreshStatus() {
  const s = await (await fetch('/api/status')).json();
  $('status').textContent = `${s.entries} entries · ${s.entities} entities`;
}
refreshStatus();

// ---- chat ----
function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

async function streamInto(el, url, payload) {
  const res = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  if (!res.ok) { el.textContent = 'error: ' + (await res.text()); return res; }
  el.classList.remove('thinking');
  el.textContent = '';
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    el.textContent += dec.decode(value, {stream: true});
    if (el.closest('#log')) $('log').scrollTop = $('log').scrollHeight;
  }
  return res;
}

async function sendChat() {
  const text = $('chat-text').value.trim();
  if (!text) return;
  $('chat-text').value = '';
  $('chat-send').disabled = true;
  addMsg('you', text);
  const el = addMsg('companion thinking', '…');
  try { await streamInto(el, '/api/chat', {message: text}); }
  finally { $('chat-send').disabled = false; $('chat-text').focus(); }
}
$('chat-send').onclick = sendChat;
$('chat-text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
$('reset').onclick = async () => {
  await fetch('/api/reset', {method: 'POST'});
  $('log').innerHTML = '';
};

$('refresh-summaries').onclick = async () => {
  const b = $('refresh-summaries');
  b.disabled = true;
  b.textContent = 'refreshing…';
  try {
    const r = await api('/api/summaries/refresh', {});
    if (r) b.textContent = `memory current (${r.arcs} weeks)`;
  } finally {
    setTimeout(() => { b.textContent = 'refresh memory'; b.disabled = false; }, 4000);
  }
};

// ---- write ----
$('entry-send').onclick = async () => {
  const text = $('entry-text').value.trim();
  if (!text) return;
  $('entry-send').disabled = true;
  $('entry-saved').textContent = 'saving…';
  const el = $('entry-response');
  el.style.display = 'block';
  el.classList.add('thinking');
  el.textContent = '…';
  try {
    const res = await streamInto(el, '/api/entry', {text});
    const id = res.headers.get('X-Entry-Id');
    $('entry-saved').textContent = id ? `saved (${id})` : 'saved';
    $('entry-text').value = '';
    refreshStatus();
  } finally { $('entry-send').disabled = false; }
};

// ---- entities ----
async function loadEntities() {
  entities = await (await fetch('/api/entities')).json();
  renderEntityList();
  refreshStatus();
}

function renderEntityList() {
  const filter = $('search').value.trim().toLowerCase();
  const groups = {person: [], project: [], place: []};
  for (const [name, info] of Object.entries(entities)) {
    const hay = (name + ' ' + (info.aliases || []).join(' ')).toLowerCase();
    if (filter && !hay.includes(filter)) continue;
    groups[info.type].push([name, info.mentions]);
  }
  const wrap = $('entity-groups');
  wrap.innerHTML = '';
  for (const kind of ['person', 'project', 'place']) {
    const items = groups[kind].sort((a, b) => b[1] - a[1]);
    if (!items.length) continue;
    const h = document.createElement('div');
    h.className = 'kind';
    h.textContent = `${kind}s (${items.length})`;
    wrap.appendChild(h);
    for (const [name, mentions] of items) {
      const b = document.createElement('button');
      b.className = 'ent' + (name === selected ? ' sel' : '');
      b.innerHTML = `${name} <span class="n">${mentions}</span>`;
      b.onclick = () => showEntity(name);
      wrap.appendChild(b);
    }
  }
}
$('search').oninput = renderEntityList;

async function api(url, payload) {
  const res = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const r = await res.json();
  if (r.error) { alert(r.error); return null; }
  return r;
}

async function showEntity(name) {
  selected = name;
  renderEntityList();
  const r = await (await fetch('/api/entities/observations?name=' + encodeURIComponent(name))).json();
  if (r.error) { alert(r.error); return; }
  selected = r.name;
  const info = entities[r.name] || {};
  $('entity-name').textContent = r.name;
  $('entity-meta').textContent = `${r.type} · ${r.observations.length} observations`;
  $('entity-actions').style.display = 'flex';
  $('merge-target').value = '';
  $('retype-kind').value = '';

  // aliases
  $('alias-row').style.display = 'flex';
  const chips = $('alias-chips');
  chips.innerHTML = '';
  for (const a of (info.aliases || [])) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = a + ' ';
    const x = document.createElement('button');
    x.textContent = '×';
    x.title = 'remove alias';
    x.onclick = async () => {
      if (await api('/api/entities/alias', {name: r.name, remove: a})) await reloadEntity(r.name);
    };
    c.appendChild(x);
    chips.appendChild(c);
  }

  // observations grouped by date, each editable
  const docEl = $('entity-doc');
  docEl.innerHTML = '';
  let lastDate = null;
  for (const o of r.observations) {
    if (o.date !== lastDate) {
      lastDate = o.date;
      const d = document.createElement('div');
      d.className = 'obs-date';
      d.textContent = o.date + (o.extracted_name !== r.name ? ` · as "${o.extracted_name}"` : '');
      docEl.appendChild(d);
    }
    const row = document.createElement('div');
    row.className = 'obs';
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = o.text;
    const ops = document.createElement('span');
    ops.className = 'ops';
    const mk = (label, title, fn) => {
      const b = document.createElement('button');
      b.textContent = label; b.title = title; b.onclick = fn;
      ops.appendChild(b);
    };
    mk('edit', 'edit this observation', async () => {
      const text = prompt('Edit observation:', o.text);
      if (text === null || text.trim() === o.text) return;
      if (await api('/api/observation', {...o, action: 'edit', text: text.trim()})) await reloadEntity(r.name);
    });
    mk('move', 'reassign to a different entity', async () => {
      const target = prompt('Move this observation to which entity?\n(prefix with person:/project:/place: if it\'s new)', '');
      if (!target) return;
      let kind = r.type, tname = target.trim();
      const m = tname.match(/^(person|project|place):(.+)$/);
      if (m) { kind = m[1]; tname = m[2].trim(); }
      else if (entities[tname]) kind = entities[tname].type;
      if (await api('/api/observation', {...o, action: 'reassign', target_kind: kind, target_name: tname})) await reloadEntity(r.name);
    });
    mk('×', 'delete this observation', async () => {
      if (!confirm('Delete this observation?')) return;
      if (await api('/api/observation', {...o, action: 'delete'})) await reloadEntity(r.name);
    });
    row.appendChild(t);
    row.appendChild(ops);
    docEl.appendChild(row);
  }
}

async function reloadEntity(name) {
  await loadEntities();
  if (entities[name]) await showEntity(name);
  else {
    $('entity-name').textContent = 'select an entity';
    $('entity-meta').textContent = '';
    $('entity-doc').innerHTML = '';
    $('entity-actions').style.display = 'none';
    $('alias-row').style.display = 'none';
  }
}

function clearDetail(msg) {
  selected = null;
  $('entity-name').textContent = msg;
  $('entity-meta').textContent = '';
  $('entity-doc').innerHTML = '';
  $('entity-actions').style.display = 'none';
  $('alias-row').style.display = 'none';
  loadEntities();
}

$('merge-btn').onclick = async () => {
  const target = $('merge-target').value.trim();
  if (!selected || !target) return;
  if (!confirm(`Merge "${selected}" into "${target}"?\n("${selected}" stays as an alias)`)) return;
  const r = await api('/api/entities/merge', {source: selected, target});
  if (r) clearDetail(`merged into ${r.into}`);
};

$('correct-btn').onclick = async () => {
  const target = $('merge-target').value.trim();
  if (!selected || !target) return;
  if (!confirm(`Correct "${selected}" to "${target}"?\n(typo fix — "${selected}" is NOT kept as an alias)`)) return;
  const r = await api('/api/entities/correct', {source: selected, target});
  if (r) clearDetail(`corrected to ${r.into}`);
};

$('retype-kind').onchange = async () => {
  const kind = $('retype-kind').value;
  if (!selected || !kind) return;
  const newName = prompt(`Move "${selected}" to ${kind}s. Rename it? (leave as-is to keep the name)`, selected);
  if (newName === null) { $('retype-kind').value = ''; return; }
  const r = await api('/api/entities/retype', {name: selected, new_type: kind, new_name: newName.trim()});
  if (r) clearDetail(`moved to ${kind}s`);
};

$('alias-add-btn').onclick = async () => {
  const a = $('alias-new').value.trim();
  if (!selected || !a) return;
  if (await api('/api/entities/alias', {name: selected, add: a})) {
    $('alias-new').value = '';
    await reloadEntity(selected);
  }
};

$('rename-btn').onclick = async () => {
  if (!selected) return;
  const newName = prompt(`Rename "${selected}" to:`, selected);
  if (newName === null || !newName.trim() || newName.trim() === selected) return;
  const r = await api('/api/entities/rename', {source: selected, target: newName.trim()});
  if (r) { selected = r.to; await reloadEntity(r.to); }
};

$('delete-btn').onclick = async () => {
  if (!selected) return;
  if (!confirm(`Delete "${selected}" from the entity graph?`)) return;
  const r = await api('/api/entities/delete', {name: selected});
  if (r) clearDetail('deleted');
};

async function histStep(url) {
  const res = await fetch(url, {method: 'POST'});
  const r = await res.json();
  if (r.error) { alert(r.error); return; }
  await loadEntities();
  if (selected && entities[selected]) await showEntity(selected);
  else if (selected) clearDetail(r.undid ? `undid: ${r.undid}` : `redid: ${r.redid}`);
  refreshHistoryButtons();
}
$('undo-btn').onclick = () => histStep('/api/undo');
$('redo-btn').onclick = () => histStep('/api/redo');

async function refreshHistoryButtons() {
  const h = await (await fetch('/api/history')).json();
  $('undo-btn').title = h.undo ? `undo: ${h.undo}` : 'nothing to undo';
  $('redo-btn').title = h.redo ? `redo: ${h.redo}` : 'nothing to redo';
  $('undo-btn').style.opacity = h.undo ? 1 : .4;
  $('redo-btn').style.opacity = h.redo ? 1 : .4;
}
refreshHistoryButtons();
setInterval(refreshHistoryButtons, 15000);

// ---- merge suggestions ----
document.querySelectorAll('[data-suggest]').forEach(b => b.onclick = async () => {
  const kind = b.dataset.suggest;
  const panel = $('suggest-panel');
  panel.style.display = 'block';
  panel.textContent = `asking claude for ${kind} merge suggestions…`;
  const r = await api('/api/entities/suggest', {kind});
  if (!r) { panel.style.display = 'none'; return; }
  panel.innerHTML = '';
  if (!r.groups.length) { panel.textContent = 'no confident suggestions — looks clean.'; return; }
  for (const g of r.groups) {
    const div = document.createElement('div');
    div.className = 'sg';
    div.innerHTML = `<strong>${g.members.join(', ')}</strong> → ${g.canonical}<div class="r">${g.reason}</div>`;
    const ok = document.createElement('button');
    ok.className = 'quiet'; ok.textContent = 'apply';
    ok.onclick = async () => {
      for (const m of g.members) await api('/api/entities/merge', {source: m, target: g.canonical});
      div.remove();
      loadEntities();
    };
    const no = document.createElement('button');
    no.className = 'quiet'; no.textContent = 'dismiss';
    no.onclick = () => div.remove();
    div.appendChild(ok);
    div.appendChild(document.createTextNode(' '));
    div.appendChild(no);
    panel.appendChild(div);
  }
});
</script>
</body>
</html>
