name: security

on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The smoke-test job (mock-mode boot + /api/status) and the leak-grep job
# (Phase 0 item 12) join this workflow in Phase 3 item 6, once mock mode
# (Phase 1) exists for the server to boot against.
