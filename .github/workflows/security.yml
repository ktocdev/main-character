name: security

on: [push, pull_request]

# gitleaks-action lists a PR's commits to scan only what the PR adds, which
# needs pull-requests:read — the default GITHUB_TOKEN doesn't grant it, and
# the action fails with a 403 rather than degrading to a full-history scan.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable, and
      # these run on every push with a token in scope. Dependabot bumps
      # them by SHA and keeps the trailing version comment honest.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Phase 0 item 12. Runs the pattern pass only — the name pass needs
  # third-party-names.txt, which is gitignored because the list is itself
  # sensitive, so CI cannot see it. That half stays a local pre-push gate;
  # see the header of scripts/check_leaks.sh.
  leak-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: bash scripts/check_leaks.sh

  # Phase 3 item 6: the check that keeps "clone it and it works" true.
  # Deliberately a *fresh* checkout with no .env and no data dirs — that
  # is the state a stranger following the README's mock-mode quickstart
  # is in, and the state that was never actually tested before.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      # From the lock, not requirements.txt — the README tells cloners to
      # install this way, so this is also the check that the lock resolves.
      # pytest is pinned here rather than added to the lock: the lock is
      # the runtime set a cloner installs, and Dependabot is scoped to it.
      - run: |
          pip install -r requirements.lock
          pip install pytest==8.3.4

      # -u because the pipeline's progress output is block-buffered when
      # stdout is a pipe; without it a failing run logs nothing useful.
      - run: python -u -m pytest tests/ -q
        env:
          MC_MOCK: '1'
